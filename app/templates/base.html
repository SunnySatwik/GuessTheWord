<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Guess the Word{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='css/base.css') }}">
    {% block head %}{% endblock %}
</head>
<body>
    <header class="app-header">
        <div class="container">
            <h1 class="logo">Guess the Word</h1>
        </div>
    </header>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer class="app-footer">
        <div class="container">
            <p>&copy; 2026 Guess the Word &bull; OpenText Pre-Internship Project</p>
        </div>
    </footer>
</body>
</html>
