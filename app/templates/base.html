<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Guess the Word{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='css/base.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', path='css/auth.css') }}">
    {% block head %}{% endblock %}
</head>
<body>
    <header class="app-header">
        <div class="container nav-container">
            <a href="/" class="logo-link">
                <h1 class="logo">Guess the Word</h1>
            </a>
            <nav class="nav-links">
                {% if user %}
                    <a href="/game" class="nav-link">Play Game</a>
                    <span class="user-pill">
                        <span class="user-name">{{ user.username }}</span>
                        <span class="role-badge">{{ user.role.value }}</span>
                    </span>
                    <form action="/logout" method="post" class="logout-form">
                        <button type="submit" class="btn btn-logout">Logout</button>
                    </form>
                {% else %}
                    <a href="/login" class="nav-link">Log In</a>
                    <a href="/register" class="btn btn-nav-cta">Register</a>
                {% endif %}
            </nav>
        </div>
    </header>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer class="app-footer">
        <div class="container">
            <p>&copy; 2026 Guess the Word &bull; OpenText Pre-Internship Project</p>
        </div>
    </footer>

    {% block scripts %}{% endblock %}
</body>
</html>
